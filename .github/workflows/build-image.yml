name: Build and push image

# 用途：本机没有 Docker，改由 GitHub 的构建机把镜像打好并推到 ghcr.io，
# 供 Sealos「应用管理」直接拉取部署。
#
# 镜像地址：ghcr.io/<owner>/<repo>:latest 与 :<commit-sha>
#
# ⚠️ 首次推送后，ghcr 的 package 默认是 **私有** 的，Sealos 拉不到。
#    需手动改成公开：
#    GitHub → 仓库页右侧 Packages → 选中本包 → Package settings
#    → Danger Zone → Change visibility → Public

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## 镜像已推送"
            echo ""
            echo "在 Sealos「应用管理」里填这个镜像地址："
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
            echo ""
            echo "别忘了把 package 可见性改成 Public，否则 Sealos 拉不到。"
          } >> "$GITHUB_STEP_SUMMARY"
