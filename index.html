<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>知乎趣报 · iPhone 17 Pro Max</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="shell">
      <section class="stagecopy">
        <div class="overline">KNOWLEDGE DAILY / IOS CONCEPT</div>
        <h1>每天一份，<br /><span>为你编好的报纸。</span></h1>
        <div class="rule"></div>
        <p>
          知日报把你关注的人、知乎真实经验和不同观点，编成一份可以读完、理解和复习的知识日报。
        </p>
        <ul>
          <li>
            <b>01 / 报纸头版</b>
            <span>一眼看到今天最值得理解的主题。</span>
          </li>
          <li>
            <b>02 / 观点对照</b>
            <span>把同一个问题的不同答案放在一起看。</span>
          </li>
          <li>
            <b>03 / 知识留存</b>
            <span>用卡片和轻任务，让阅读产生下一步。</span>
          </li>
        </ul>
      </section>

      <section class="phone">
        <div class="screen" id="screen">
          <div class="status">
            <span>9:41</span>
            <span>▮▮▮ ᯤ ▰</span>
          </div>
          <div class="app" id="app"></div>
          <nav class="bottom" id="tabs"></nav>
        </div>
      </section>

      <aside class="sidecopy">
        <div class="overline">DEMO FLOW / 4 TABS</div>
        <h2>从领域到日报</h2>
        <p>首页按领域分板块，点进去读当天日报；日历按知乎的方式回看每一天的完整报纸。</p>
        <div class="rule"></div>
        <div class="flow">
          首页 · 领域日报<br />
          发现 · 日历回看<br />
          我的
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
